<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>GPU to Atom</title>
    <meta name="description" content="Scroll-driven 3D teardown of a graphics card, from the shroud down to a single silicon atom." />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="spot"></div>
    <div id="flash"></div>
    <svg id="leader" aria-hidden="true"><polyline points="" /><circle r="3" /></svg>
    <div id="tip" role="tooltip">
      <div class="tip-kind"></div>
      <div class="tip-title"></div>
      <div class="tip-specs"></div>
      <div class="tip-hint">click to inspect</div>
    </div>

    <div id="hud">
      <header class="hud-top">
        <div class="top-left">
          <span class="brand">GPU <span class="arrow">&#9656;</span> ATOM</span>
          <nav id="crumbs" aria-label="Scale breadcrumb"></nav>
        </div>
        <span id="lvl-index">01 / 08</span>
      </header>

      <section class="hud-main">
        <div id="lvl-scale">30 cm</div>
        <div id="lvl-name">Graphics card</div>
        <div id="lvl-desc"></div>
        <div id="lvl-caption"></div>
      </section>

      <nav id="rail"></nav>

      <footer class="hud-bottom">
        <div class="fov">
          <span class="fov-label">field of view</span>
          <span id="fov-value">&mdash;</span>
        </div>
        <div id="nav">
          <button id="nav-prev" type="button" title="Previous scale (&larr;)">&#9664;</button>
          <button id="nav-explore" type="button" title="Explore mode (E)">Explore</button>
          <button id="nav-next" type="button" title="Next scale (&rarr;)">&#9654;</button>
        </div>
        <div id="scroll-hint">scroll to descend <span>&darr;</span></div>
      </footer>
      <div id="explore-hint">drag&nbsp;· orbit &nbsp; wheel&nbsp;· zoom &nbsp; right-drag&nbsp;· pan &nbsp; click&nbsp;· inspect &nbsp; esc&nbsp;· exit</div>
    </div>

    <aside id="inspector" aria-live="polite">
      <button class="insp-close" type="button" title="Close (Esc)">&times;</button>
      <div class="insp-kind"></div>
      <h2 class="insp-title"></h2>
      <dl class="insp-specs"></dl>
      <p class="insp-note"></p>
      <div class="insp-actions"></div>
      <div class="insp-controls"></div>
    </aside>

    <div id="scroll-space"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
