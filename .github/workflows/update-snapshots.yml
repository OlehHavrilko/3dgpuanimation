name: Update visual snapshots

# Run by hand on a branch after an intended visual change: re-renders every frame in
# tests/e2e/visual.spec.ts on the same runner image as CI and commits the new baselines.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual -- --update-snapshots=all
      - name: Commit changed baselines
        run: |
          git add tests/e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update visual snapshots"
          git push
